<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Agentic Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: 'Segoe UI', system-ui; }
    .card { background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; border-radius: 12px; backdrop-filter: blur(10px); transition: all 0.3s; }
    .card:hover { border-color: #8b5cf6; transform: translateY(-2px); box-shadow: 0 20px 40px rgba(139, 92, 246, 0.1); }
    input, select, textarea { background: rgba(15, 23, 42, 0.5) !important; border: 1px solid #334155 !important; color: #f1f5f9 !important; border-radius: 8px; }
    input:focus, select:focus, textarea:focus { border-color: #8b5cf6 !important; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1) !important; outline: none; }
    button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); transition: all 0.3s; }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="app"></div>
  <script src="https://cdn.ethers.org/v6/ethers.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
